[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fv-youtube-connector"
version = "0.1.0"
description = "FV® YouTube Connector for FV® Core"
requires-python = ">=3.11"
authors = [{name = "José Francisco Villaseñor Zúñiga"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
